---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes


- name: Install required packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present


- name: Create Docker keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'


- name: Add Docker GPG key
  ansible.builtin.shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg |
    gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg


- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu noble stable"
    state: present


- name: Update apt cache after adding Docker repo
  ansible.builtin.apt:
    update_cache: yes

- name: Stop old Docker services
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
  loop:
    - docker
    - containerd
  ignore_errors: yes


- name: Remove conflicting Ubuntu Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - docker-compose
      - containerd
      - runc
    state: absent
    purge: yes


- name: Clean unused packages
  ansible.builtin.apt:
    autoremove: yes
    autoclean: yes

- name: Install Docker Engine and Docker Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present


- name: Install Python Docker SDK
  ansible.builtin.apt:
    name: python3-docker
    state: present


- name: Enable containerd
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: yes


- name: Enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes


- name: Add ubuntu user to docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: yes

- name: Verify Docker version
  ansible.builtin.command:
    cmd: docker --version
  register: docker_version


- name: Verify Docker Compose
  ansible.builtin.command:
    cmd: docker compose version
  register: compose_version


- name: Show Docker versions
  ansible.builtin.debug:
    msg:
      - "{{ docker_version.stdout }}"
      - "{{ compose_version.stdout }}"